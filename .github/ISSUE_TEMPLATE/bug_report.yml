name: Bug report
description: Report a reproducible desktop or Android problem
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Desktop local web, Android, Both]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 3.1.0-dev or commit SHA
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Do not include private text, audio, tokens, signing data, or unreviewed logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Add screenshots or a minimal reviewed log when useful.
