name: Android CI

on:
  push:
    paths:
      - "android/**"
      - "client/**"
      - "models/**"
      - "VERSION"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "client/**"
      - "models/**"
      - "VERSION"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

jobs:
  android-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build verified debug and unsigned release APKs
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleRelease --dependency-verification strict --no-daemon

      - name: Audit packaged runtime and web assets
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk > /tmp/apk-contents.txt
          grep -q "assets/webapp/index.html" /tmp/apk-contents.txt
          grep -q "assets/model-catalog.v1.json" /tmp/apk-contents.txt
          grep -q "lib/arm64-v8a/libsherpa-onnx-jni.so" /tmp/apk-contents.txt
          grep -q "lib/x86_64/libsherpa-onnx-jni.so" /tmp/apk-contents.txt
          unzip -l android/app/build/outputs/apk/release/app-release-unsigned.apk > /tmp/release-apk-contents.txt
          grep -q "assets/webapp/index.html" /tmp/release-apk-contents.txt
          grep -q "assets/model-catalog.v1.json" /tmp/release-apk-contents.txt
          grep -q "lib/arm64-v8a/libsherpa-onnx-jni.so" /tmp/release-apk-contents.txt

      - uses: actions/upload-artifact@v4
        with:
          name: open-mobile-tts-apk-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
