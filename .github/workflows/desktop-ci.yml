name: Desktop CI

on:
  push:
    branches: [main, develop]
    paths:
      - "server/**"
      - "client/**"
      - "models/**"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "run.py"
      - "VERSION"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "client/**"
      - "models/**"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "run.py"
      - "VERSION"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "server/requirements-dev.lock"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg

      - name: Install pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r server/requirements-dev.lock

      - name: Compile launcher and server modules
        run: |
          python -m py_compile run.py server/src/*.py

      - name: Run server tests
        working-directory: server
        run: python -m pytest tests -p no:cacheprovider -q

      - name: Smoke-test local API
        if: matrix.python-version == '3.11'
        working-directory: server
        run: |
          python -m uvicorn src.main:app --host 127.0.0.1 --port 8010 > /tmp/openmobiletts-ci.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8010/api/health > /tmp/openmobiletts-health.json; then
              break
            fi
            sleep 1
          done
          python -c 'import json; data=json.load(open("/tmp/openmobiletts-health.json")); assert data["status"] == "healthy"; assert data["name"] == "Open Mobile TTS"'

  client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "client/package-lock.json"

      - name: Install pinned client dependencies
        working-directory: client
        run: npm ci

      - name: Check client types and accessibility
        working-directory: client
        run: npm run check

      - name: Build static client
        working-directory: client
        run: npm run build
