name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify tag matches product version
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

      - name: Restore release keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/open-mobile-tts-release.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          OMTTS_KEYSTORE_PATH: ${{ runner.temp }}/open-mobile-tts-release.jks
          OMTTS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OMTTS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OMTTS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --dependency-verification strict --no-daemon

      - name: Verify and stage release assets
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          asset="open-mobile-tts-$GITHUB_REF_NAME.apk"
          test -f "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          unzip -l "$apk" > "$RUNNER_TEMP/apk-contents.txt"
          grep -q "assets/webapp/index.html" "$RUNNER_TEMP/apk-contents.txt"
          grep -q "assets/model-catalog.v1.json" "$RUNNER_TEMP/apk-contents.txt"
          grep -q "lib/arm64-v8a/libsherpa-onnx-jni.so" "$RUNNER_TEMP/apk-contents.txt"
          mkdir release
          cp "$apk" "release/$asset"
          cd release
          sha256sum "$asset" > "$asset.sha256"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --verify-tag
          --prerelease
          --title "Open Mobile TTS $GITHUB_REF_NAME (Android preview)"
          --generate-notes
          --notes "Signed Android preview for Android 8.0 and newer. The required Kokoro model downloads on first launch. This is not yet a stable or Play Store release; see the README for installation and current validation boundaries."
